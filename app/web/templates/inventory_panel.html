{% extends "base.html" %}
{% block content %}
<div x-data="inventoryPanel()" x-init="load()">

<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-semibold text-gray-900">Stock Levels</h1>
  <button @click="sync()" :disabled="syncBusy"
          class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md
                 hover:bg-blue-700 disabled:opacity-50">
    <span x-show="!syncBusy">Sync from menu</span>
    <span x-show="syncBusy">Working…</span>
  </button>
</div>

<template x-if="syncResult">
  <div class="mb-4 px-4 py-2 bg-blue-50 text-blue-800 text-sm rounded-md" x-text="syncResult"></div>
</template>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">SKU</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">State</th>
        <th class="px-6 py-3"></th>
      </tr>
    </thead>
    <!-- x-if wrapping x-for is the only reliable way to have multiple <tr> per
         x-for iteration in Alpine 3 (same pattern as menu_admin.html). -->
    <template x-if="!items.length">
      <tbody>
        <tr><td colspan="5" class="px-6 py-12 text-center text-sm text-gray-400">No inventory items found.</td></tr>
      </tbody>
    </template>
    <template x-for="item in items" :key="item.sku">
      <tbody>
        <tr :class="rowClass(item.state)">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-900" x-text="item.sku"></td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" x-text="item.name"></td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 text-right">
            <span x-show="editingSku !== item.sku" x-text="item.quantity"></span>
            <input x-show="editingSku === item.sku" x-model.number="editQuantity" type="number"
                   @keydown.enter="submitEdit(item.sku)" @keydown.escape="cancelEdit()"
                   class="w-24 border border-gray-300 rounded-md shadow-sm text-sm p-1 text-right">
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600" x-text="item.state"></td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm space-x-2">
            <template x-if="editingSku !== item.sku">
              <button @click="startEdit(item)" class="text-indigo-600 hover:text-indigo-800 text-xs font-medium">Edit</button>
            </template>
            <template x-if="editingSku === item.sku">
              <span>
                <button @click="submitEdit(item.sku)" :disabled="editBusy"
                        class="text-white bg-indigo-600 hover:bg-indigo-700 text-xs font-medium
                               px-2 py-1 rounded-md disabled:opacity-50">Save</button>
                <button @click="cancelEdit()" class="text-gray-500 hover:text-gray-700 text-xs font-medium">Cancel</button>
              </span>
            </template>
          </td>
        </tr>
        <tr x-show="editingSku === item.sku && editError" class="bg-red-50">
          <td colspan="5" class="px-4 py-1 text-xs text-red-600" x-text="editError"></td>
        </tr>
      </tbody>
    </template>
  </table>
</div>
</div>

<script>
function inventoryPanel() {
  return {
    items: [],
    syncBusy: false,
    syncResult: null,

    editingSku: null,
    editQuantity: 0,
    editBusy: false,
    editError: null,

    async load() {
      const resp = await fetch('/admin/ui/inventory/items');
      const data = await resp.json();
      this.items = data.items || [];
    },

    rowClass(state) {
      return {
        LOW_STOCK: 'bg-amber-50',
        CRITICAL: 'bg-red-50',
        OUT_OF_STOCK: 'line-through text-gray-400',
      }[state] || '';
    },

    async sync() {
      this.syncBusy = true;
      this.syncResult = null;
      try {
        const resp = await fetch('/admin/ui/inventory/sync-json', { method: 'POST' });
        if (!resp.ok) {
          const text = await resp.text();
          this.syncResult = `Server error ${resp.status}: ${text.slice(0, 200)}`;
          return;
        }
        const data = await resp.json();
        this.items = data.items || [];
        this.syncResult = `Sync: ${data.created} new item(s) created`
          + (data.skipped_no_sku ? `, ${data.skipped_no_sku} active product(s) skipped (no sku assigned)` : '')
          + '.';
      } catch (e) {
        this.syncResult = String(e);
      } finally {
        this.syncBusy = false;
      }
    },

    startEdit(item) {
      this.editingSku = item.sku;
      this.editQuantity = item.quantity;
      this.editError = null;
    },

    cancelEdit() {
      this.editingSku = null;
      this.editError = null;
    },

    async submitEdit(sku) {
      this.editBusy = true;
      this.editError = null;
      try {
        const resp = await fetch(`/admin/ui/inventory/${encodeURIComponent(sku)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quantity: this.editQuantity }),
        });
        if (!resp.ok) {
          const text = await resp.text();
          this.editError = `Error ${resp.status}: ${text.slice(0, 200)}`;
          return;
        }
        const data = await resp.json();
        const idx = this.items.findIndex(i => i.sku === sku);
        if (idx !== -1) this.items[idx] = data.item;
        this.editingSku = null;
      } catch (e) {
        this.editError = String(e);
      } finally {
        this.editBusy = false;
      }
    },
  };
}
</script>
{% endblock %}
