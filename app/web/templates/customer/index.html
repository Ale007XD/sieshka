{% extends "customer/shop_base.html" %}
{% block title %}Меню — Sieshka{% endblock %}

{% block head %}
<style>
  .category-filter-bar {
    background: var(--color-bg-primary);
    border-bottom: 1px solid var(--color-accent-border);
  }
  #categoryCarousel::-webkit-scrollbar { display: none; }
  .category-btn {
    background-color: var(--color-bg-secondary);
    border: 1px solid var(--color-accent-border);
    color: var(--color-text-secondary);
    font-weight: 500;
    transition: all 0.2s ease;
    padding: 0.4rem 1rem;
    white-space: nowrap;
  }
  .category-btn:hover {
    background-color: var(--color-accent-bg);
    border-color: var(--brand-primary);
    color: var(--brand-primary);
  }
  .category-btn.active {
    background-color: var(--brand-primary);
    border-color: var(--brand-primary);
    color: white;
    font-weight: 600;
  }
  .product-card.unavailable { opacity: 0.65; }
  .skeleton {
    background: linear-gradient(90deg, var(--color-bg-tertiary) 25%, var(--color-bg-secondary) 50%, var(--color-bg-tertiary) 75%);
    background-size: 200% 100%;
    animation: skeleton-loading 1.5s ease-in-out infinite;
    border-radius: var(--radius-md);
    height: 110px;
  }
  @keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media (max-width: 576px) {
    .category-btn { padding: 0.35rem 0.75rem; font-size: 0.85rem; min-height: 40px; }
  }
</style>
{% endblock %}

{% block content %}

<!-- Sticky method+category bar: compact method dropdown on the left,
     scrolling category carousel on the right — one row instead of two. -->
<div class="category-filter-bar sticky-top">
  <div class="container py-2 d-flex align-items-center gap-2">
    <div class="dropdown method-selector flex-shrink-0">
      <button class="btn btn-brand dropdown-toggle rounded-pill" type="button"
              id="methodSelectorBtn" data-bs-toggle="dropdown" aria-expanded="false"
              style="font-weight:600; white-space: nowrap;">
        <i class="bi bi-truck me-1"></i><span id="methodSelectorLabel">Доставка</span>
      </button>
      <ul class="dropdown-menu" aria-labelledby="methodSelectorBtn">
        <li>
          <button type="button" class="dropdown-item active" data-method="delivery">
            <i class="bi bi-truck me-2"></i>Доставка
          </button>
        </li>
        <li>
          <button type="button" class="dropdown-item" data-method="pickup">
            <i class="bi bi-shop me-2"></i>Самовывоз
          </button>
        </li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-2 overflow-x-auto" id="categoryCarousel" style="scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none;">
      <button class="btn btn-sm rounded-pill category-btn active" data-category-id="all" style="white-space: nowrap; min-width: 100px;">
        <i class="bi bi-grid-fill me-1"></i>Все меню
      </button>
      <div id="categoryButtons" class="d-flex align-items-center gap-2"></div>
    </div>
  </div>
</div>

<!-- Menu -->
<div id="menu-status" class="menu-status text-center text-muted py-3" role="status">Загрузка меню…</div>
<div id="menu-root" class="menu-root">
  <!-- Menu container (filled by menu.js) -->
  <div id="menu-container" class="menu-container mt-2"></div>
</div>

<!-- cart-root + toast-root required by JS contract -->
<div id="cart-root" class="d-none">
  <span id="cart-summary">0 ₽</span>
  <span id="cart-count">0</span>
  <!-- 2026-08-04: cart-total added here — cart.js::updateNavbarCart()'s
       legacy "menu.js contract compliance" block (menuCartTotal) references
       #cart-total; it used to resolve only because the old cart.html
       accidentally reused this exact id for its real, visible total. That
       template has been rewritten against cart.js's actual #cart/#emptyCart/
       #cartReal/#cartActions contract (see cart.html), so the decoy target
       for this one legacy id needs to live here instead, alongside its
       siblings. -->
  <span id="cart-total" class="d-none">0 ₽</span>
</div>
<div id="toast-root" class="d-none"></div>

<!-- Скрытые элементы, требуемые menu.js (other-date modal) -->
<div id="otherDateModal" class="d-none"></div>
<div id="modalCartPreview" class="d-none"></div>
<button id="whatsappOrderBtn" class="d-none" type="button"></button>
<select id="slot-select" class="d-none"></select>

<!-- Sticky cart bar — visibility & content driven by CartManager.updateAllUI() (cart.js) -->
<div class="sticky-cartbar" id="stickyCartBar">
  <div class="container d-flex justify-content-between align-items-center gap-3">
    <div class="sticky-cartbar-summary">
      <span class="sticky-cartbar-count" id="stickyCartBarCount">0</span>
      <span class="sticky-cartbar-label" id="stickyCartBarLabel">товара</span>
      <span class="sticky-cartbar-sep">·</span>
      <span class="sticky-cartbar-total" id="stickyCartBarTotal">0 ₽</span>
    </div>
    <!-- 2026-08-04 fix: was href="/cart" — that page's markup (#cart-root/#cart-summary)
         is disconnected from cart.js::renderCartPage() contract (#cart/#emptyCart/#cartReal),
         so it always showed a static empty-cart placeholder regardless of real cart content.
         Offcanvas checkout button already points straight to /checkout — mirrored here. -->
    <a href="/checkout" class="btn btn-brand px-4 shadow-sm rounded-pill flex-shrink-0">
      <i class="bi bi-cart3 me-2"></i>Оформить
    </a>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/menu.js?v={{ asset_version('js/menu.js') }}" nonce="{{ csp_nonce }}"></script>
{% endblock %}
