{% extends "customer/shop_base.html" %}
{% block title %}Меню — Sieshka{% endblock %}
{% block content %}
<section class="menu-page">
  <h1 class="mb-3">Меню</h1>
  
  <div class="d-flex align-items-center gap-2 overflow-x-auto mb-4 category-bar-sticky" id="categoryButtons" style="scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none;">
    <button class="btn btn-sm rounded-pill category-btn active" data-category-id="all" style="white-space: nowrap; min-width: 100px;">
      <i class="bi bi-grid-fill me-1"></i>Все меню
    </button>
  </div>

  <div id="menu-status" class="menu-status" role="status">Загрузка меню…</div>
  <div id="menu-root" class="menu-root">
    <div id="menu-container"></div>
  </div>
</section>

<!-- Sticky cart bar — visibility & content driven by CartManager.updateAllUI() (cart.js) -->
<div class="sticky-cartbar" id="stickyCartBar">
  <div class="container d-flex justify-content-between align-items-center gap-3">
    <div class="sticky-cartbar-summary">
      <span class="sticky-cartbar-count" id="stickyCartBarCount">0</span>
      <span class="sticky-cartbar-label" id="stickyCartBarLabel">товара</span>
      <span class="sticky-cartbar-sep">·</span>
      <span class="sticky-cartbar-total" id="stickyCartBarTotal">0 ₽</span>
    </div>
    <a href="/cart" class="btn btn-brand px-4 shadow-sm rounded-pill flex-shrink-0">
      <i class="bi bi-cart3 me-2"></i>Оформить
    </a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/menu.js" nonce="{{ csp_nonce }}"></script>
{% endblock %}
