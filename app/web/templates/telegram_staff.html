<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sieshka — панель сотрудника</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-light">
<div class="container py-3" style="max-width: 480px;">
  <h5 class="mb-3">Панель сотрудника</h5>
  <div id="authStatus" class="alert alert-secondary py-2 small mb-3">Проверка доступа…</div>

  <div id="panel" class="d-none">
    <h6 class="mt-2">Кухня</h6>
    <div id="ticketList" class="mb-4"></div>
    <button id="refreshTickets" class="btn btn-sm btn-outline-secondary mb-4">Обновить список</button>

    <h6>Заказ (по ID)</h6>
    <div class="input-group mb-2">
      <input type="text" id="orderIdInput" class="form-control form-control-sm" placeholder="order_id (UUID)">
    </div>
    <div class="d-flex flex-wrap gap-1 mb-4" id="orderEventButtons"></div>
  </div>

  <div id="toast" class="position-fixed bottom-0 start-50 translate-middle-x mb-3 alert d-none" style="z-index:1050;"></div>
</div>

<script nonce="{{ csp_nonce }}">
// sprint_telegram_miniapp_frontend: deliberately minimal — a manual order_id
// input instead of a live order list, since no public GET /api/orders list
// endpoint exists yet (unlike GET /kitchen/tickets, which does). Adding one
// is a reasonable follow-up but out of scope for this sprint (Alex's
// explicit choice: "простая HTML-страница с кнопками событий", not a full
// board port).
const initData = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

const authStatusEl = document.getElementById('authStatus');
const panelEl = document.getElementById('panel');
const toastEl = document.getElementById('toast');

function showToast(message, ok) {
  toastEl.textContent = message;
  toastEl.className = 'position-fixed bottom-0 start-50 translate-middle-x mb-3 alert ' + (ok ? 'alert-success' : 'alert-danger');
  setTimeout(() => { toastEl.className += ' d-none'; }, 3500);
}

async function callTransition(path, event) {
  if (!initData) {
    showToast('Нет initData — откройте страницу внутри Telegram', false);
    return;
  }
  try {
    const resp = await fetch(path, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': initData
      },
      body: JSON.stringify({ event })
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.ok) {
      showToast('OK: ' + event, true);
      loadTickets();
    } else {
      showToast('Отказано (' + resp.status + '): ' + (data.detail || event), false);
    }
  } catch (e) {
    showToast('Ошибка сети', false);
  }
}

const KITCHEN_EVENTS = ['QUEUE', 'START_PREP', 'MARK_READY', 'HAND_OFF'];
const ORDER_EVENTS = ['ASSIGN_COURIER', 'PICKUP', 'DELIVER', 'CANCEL'];

function renderOrderButtons() {
  const container = document.getElementById('orderEventButtons');
  container.innerHTML = '';
  ORDER_EVENTS.forEach(ev => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm btn-outline-primary';
    btn.textContent = ev;
    btn.onclick = () => {
      const orderId = document.getElementById('orderIdInput').value.trim();
      if (!orderId) { showToast('Введите order_id', false); return; }
      callTransition(`/api/telegram/orders/${orderId}/transition`, ev);
    };
    container.appendChild(btn);
  });
}

async function loadTickets() {
  const listEl = document.getElementById('ticketList');
  listEl.innerHTML = '<div class="text-muted small">Загрузка…</div>';
  try {
    const resp = await fetch('/kitchen/tickets');
    const tickets = await resp.json();
    if (!Array.isArray(tickets) || tickets.length === 0) {
      listEl.innerHTML = '<div class="text-muted small">Нет активных тикетов</div>';
      return;
    }
    listEl.innerHTML = '';
    tickets.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card mb-2';
      const body = document.createElement('div');
      body.className = 'card-body py-2';
      body.innerHTML = `<div class="small text-muted mb-1">${t.id}</div><div class="fw-semibold mb-2">${t.state}</div>`;
      const btnRow = document.createElement('div');
      btnRow.className = 'd-flex flex-wrap gap-1';
      KITCHEN_EVENTS.forEach(ev => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm btn-outline-primary';
        btn.textContent = ev;
        btn.onclick = () => callTransition(`/api/telegram/kitchen/${t.id}/transition`, ev);
        btnRow.appendChild(btn);
      });
      body.appendChild(btnRow);
      card.appendChild(body);
      listEl.appendChild(card);
    });
  } catch (e) {
    listEl.innerHTML = '<div class="text-danger small">Не удалось загрузить тикеты</div>';
  }
}

if (!initData) {
  authStatusEl.className = 'alert alert-warning py-2 small mb-3';
  authStatusEl.textContent = 'Страница открыта вне Telegram — действия недоступны.';
} else {
  authStatusEl.className = 'alert alert-success py-2 small mb-3';
  authStatusEl.textContent = 'Доступ через Telegram подтверждён на уровне сервера при каждом действии.';
  panelEl.classList.remove('d-none');
  renderOrderButtons();
  loadTickets();
  document.getElementById('refreshTickets').addEventListener('click', loadTickets);
}
</script>
</body>
</html>
