{% extends "base.html" %}
{% block content %}
<div x-data="promoForm()" class="bg-white rounded-lg shadow p-6 mb-6">
  <h2 class="text-lg font-medium text-gray-900 mb-3">Instruction</h2>
  <p class="text-sm text-gray-500 mb-4">
    Examples: <code>Создай акцию Летняя, скидка 20%</code>,
    <code>активируй акцию Летняя</code>, <code>заверши акцию Летняя</code>,
    <code>заархивируй акцию Летняя</code>.
  </p>
  <textarea x-model="instruction" rows="3" required
            class="block w-full border border-gray-300 rounded-md shadow-sm
                   focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm p-2"
            placeholder="Создай акцию Летняя, скидка 20%"></textarea>
  <button @click="submit()" :disabled="busy"
          class="mt-3 inline-flex items-center px-4 py-2 border border-transparent
                 text-sm font-medium rounded-md text-white bg-indigo-600
                 hover:bg-indigo-700 disabled:opacity-50">
    <span x-show="!busy">Apply</span>
    <span x-show="busy">Working…</span>
  </button>
  <div x-show="result" class="mt-4">
    <template x-if="result && result.command">
      <div class="rounded-md bg-gray-50 p-4 text-sm">
        <div class="font-medium text-gray-900 mb-1">Confirmed command</div>
        <pre class="text-xs text-gray-700 overflow-x-auto" x-text="JSON.stringify(result.command, null, 2)"></pre>
      </div>
    </template>
    <template x-if="result && !result.ok && result.error">
      <p class="mt-2 text-sm text-red-600" x-text="'Rejected: ' + result.error"></p>
    </template>
    <template x-if="result && result.receipt">
      <div class="mt-3 rounded-md bg-gray-50 p-4 text-sm">
        <div class="font-medium text-gray-900 mb-1">Execution receipt</div>
        <div class="text-xs text-gray-700">
          status: <span class="font-mono" x-text="result.receipt.final_status"></span><br>
          trace: <span class="font-mono break-all" x-text="result.receipt.trace_id"></span><br>
          steps: <span class="font-mono" x-text="result.receipt.health.total_steps"></span>
          / success: <span class="font-mono" x-text="result.receipt.health.successful_steps"></span>
        </div>
      </div>
    </template>
  </div>
</div>

<h1 class="text-2xl font-semibold text-gray-900 mb-6">Promotions</h1>
<div hx-get="/admin/ui/promotions/partial" hx-trigger="every 5s" hx-swap="innerHTML">
  <p class="text-gray-500">Loading promotions...</p>
</div>

<script>
function promoForm() {
  return {
    instruction: '',
    busy: false,
    result: null,
    async submit() {
      if (!this.instruction.trim()) return;
      this.busy = true;
      this.result = null;
      try {
        const resp = await fetch("/admin/promotions/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ instruction: this.instruction }),
        });
        this.result = await resp.json();
        if (this.result.ok) this.instruction = '';
      } catch (e) {
        this.result = { ok: false, error: String(e), command: null, receipt: null };
      } finally {
        this.busy = false;
      }
    }
  };
}
</script>
{% endblock %}
